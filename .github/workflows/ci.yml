# Las tres suites de CLAUDE.md en cada push y PR. Si este check está en verde, el cambio se puede fusionar a main.
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (unitarias, e2e y QA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Santo_Domingo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas unitarias
        run: npm test

      # La app no tiene dependencias; Playwright solo se usa para probarla.
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.10.2   # axe-core: solo para la revisión de accesibilidad del QA

      # Sin --with-deps: ese modo corre apt-get, que se quedó colgado en el espejo de Ubuntu (2 de 4 runs).
      # El runner ya trae las librerías que Chromium necesita.
      - name: Caché del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}

      - name: Descargar Chromium
        timeout-minutes: 5   # una descarga atascada debe fallar rápido, no bloquear 15 min
        run: npx playwright install chromium

      - name: Flujos en navegador (e2e)
        timeout-minutes: 5
        run: npm run e2e

      - name: QA visual (390 px claro/oscuro, contraste, offline, letra grande)
        timeout-minutes: 5
        run: npm run qa

      - name: Guardar capturas de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-qa
          path: qa/capturas/
          retention-days: 14
