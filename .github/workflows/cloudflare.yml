# Publica en Cloudflare Pages. Corre en cada fusión a main (que ya exige CI en verde) y a mano desde la pestaña Actions.
# Si Cloudflare aún no está configurado, el flujo avisa y termina SIN fallar. Pasos en el README: "Publicar en Cloudflare".
#
#   Secreto  CLOUDFLARE_API_TOKEN   (Settings → Secrets and variables → Actions → Secrets)  permiso: Cloudflare Pages · Edit
#   Variable CLOUDFLARE_ACCOUNT_ID  (… → Variables)
#   Variable CLOUDFLARE_PROYECTO    (opcional; por defecto "dilo-transporte")
#   Variables SUPABASE_URL y SUPABASE_ANON_KEY (las mismas de GitHub Pages; la clave anon es pública por diseño)
name: Publicar en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PROYECTO: ${{ vars.CLOUDFLARE_PROYECTO || 'dilo-transporte' }}
    steps:
      - name: ¿Está configurado Cloudflare?
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configurado=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare sin configurar (falta el secreto CLOUDFLARE_API_TOKEN o la variable CLOUDFLARE_ACCOUNT_ID). No se publica nada."
          else
            echo "configurado=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cf.outputs.configurado == 'si'

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.configurado == 'si'
        with:
          node-version: 22

      - name: Pruebas unitarias (incluye la comprobación de que no hay claves secretas en el código)
        if: steps.cf.outputs.configurado == 'si'
        run: npm test

      - name: Armar el sitio (rechaza cualquier clave que no sea la pública)
        if: steps.cf.outputs.configurado == 'si'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: bash scripts/armar-sitio.sh _site

      - name: Crear el proyecto de Cloudflare Pages si no existe
        if: steps.cf.outputs.configurado == 'si'
        run: npx --yes wrangler@4 pages project create "$PROYECTO" --production-branch main || echo "El proyecto ya existe (o no se pudo crear; el siguiente paso lo dirá)."

      - name: Publicar
        if: steps.cf.outputs.configurado == 'si'
        run: npx --yes wrangler@4 pages deploy _site --project-name "$PROYECTO" --branch main --commit-hash "$GITHUB_SHA" --commit-message "Publicación $GITHUB_SHA"
